<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournoi 8 équipes</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--ac:#4f46e5;--ln:#e5e7eb;--win:#16a34a;--gold:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e30;--tx:#eef0f7;--mut:#9aa1b5;--ac:#818cf8;--ln:#2b3050;--win:#4ade80;--gold:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e30;--tx:#eef0f7;--mut:#9aa1b5;--ac:#818cf8;--ln:#2b3050;--win:#4ade80;--gold:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--ln);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 3px #0002}
.prog{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.pt{font-size:13px;color:var(--mut);margin-bottom:14px}
.round{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid var(--ln)}
.round h2{font-size:15px;margin:0 0 8px;color:var(--ac);display:flex;justify-content:space-between}
.round h2 span{color:var(--mut);font-weight:500;font-size:13px}
.m{display:grid;grid-template-columns:28px 1fr 52px 14px 52px 1fr;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--ln)}
.m:first-of-type{border-top:0}
.n{font-size:12px;color:var(--mut)}
.t{font-weight:700;font-size:17px;text-align:center;padding:6px 0;border-radius:8px;background:var(--bg)}
.t.w{background:var(--win);color:#fff}
.sep{text-align:center;color:var(--mut)}
input{width:100%;padding:8px 2px;font:700 18px inherit;font-family:inherit;text-align:center;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus{outline:0;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:10px 6px;text-align:center}
th{font-size:12px;color:var(--mut);background:var(--card);border-bottom:2px solid var(--ln)}
td{border-top:1px solid var(--ln)}
td.eq{font-weight:800;font-size:17px;text-align:left;padding-left:12px}
td.p{font-weight:800;color:var(--ac)}
tr.r1 td.eq::before{content:"🥇 "}tr.r2 td.eq::before{content:"🥈 "}tr.r3 td.eq::before{content:"🥉 "}
.wrap{overflow-x:auto;border-radius:14px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.rs{margin-top:18px;width:100%;padding:11px;border:1.5px solid var(--ln);background:none;color:var(--mut);border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>🏆 Tournoi – 8 équipes</h1>
<div class="sub">Chaque équipe rencontre toutes les autres · 7 journées · 28 matchs</div>
<div class="tabs"><button id="b1" class="on">Matchs</button><button id="b2">Classement</button></div>
<div id="v1">
  <div class="prog"><i id="bar"></i></div>
  <div class="pt" id="pt"></div>
  <div id="rounds"></div>
</div>
<div id="v2" class="hide">
  <div class="wrap"><table><thead><tr><th style="text-align:left;padding-left:12px">Éq.</th><th>Pts</th><th>J</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>+/−</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="note">Victoire 3 pts · Nul 1 pt · Défaite 0. Départage : différence de buts, puis buts marqués.</div>
</div>
<button class="rs" id="rs">Réinitialiser les scores</button>
</main>
<script>
var T="ABCDEFGH".split(""),KEY="tournoi8",S={},rounds=[],id=0;
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
for(var r=0;r<7;r++){
  var o=T.slice(1),arr=[T[0]].concat(o.slice(7-r-0>6?0:0));
  var rot=o.slice(),k=r;while(k--){rot.unshift(rot.pop())}
  arr=[T[0]].concat(rot);var ms=[];
  for(var i=0;i<4;i++){ms.push({id:++id,a:arr[i],b:arr[7-i]})}
  rounds.push(ms)
}
var box=document.getElementById("rounds");
rounds.forEach(function(ms,ri){
  var d=document.createElement("div");d.className="round";
  d.innerHTML="<h2>Journée "+(ri+1)+"<span>matchs "+ms[0].id+" à "+ms[3].id+"</span></h2>";
  ms.forEach(function(m){
    var s=S[m.id]||["",""];
    var row=document.createElement("div");row.className="m";row.id="m"+m.id;
    row.innerHTML='<span class="n">#'+m.id+'</span><div class="t" data-s="a">'+m.a+'</div><input inputmode="numeric" type="number" min="0" aria-label="Score '+m.a+'" value="'+s[0]+'"><span class="sep">–</span><input inputmode="numeric" type="number" min="0" aria-label="Score '+m.b+'" value="'+s[1]+'"><div class="t" data-s="b">'+m.b+'</div>';
    var ins=row.querySelectorAll("input");
    ins.forEach(function(inp,ix){inp.addEventListener("input",function(){
      var v=S[m.id]||["",""];v[ix]=inp.value;
      if(v[0]===""&&v[1]==="")delete S[m.id];else S[m.id]=v;
      save();upd()})});
    d.appendChild(row)
  });
  box.appendChild(d)
});
function done(v){return v&&v[0]!==""&&v[1]!==""}
function upd(){
  var st={},n=0;
  T.forEach(function(t){st[t]={t:t,p:0,j:0,g:0,n:0,d:0,bp:0,bc:0}});
  rounds.forEach(function(ms){ms.forEach(function(m){
    var v=S[m.id],row=document.getElementById("m"+m.id),ta=row.querySelector('[data-s="a"]'),tb=row.querySelector('[data-s="b"]');
    ta.classList.remove("w");tb.classList.remove("w");
    if(!done(v))return;n++;
    var x=+v[0],y=+v[1],A=st[m.a],B=st[m.b];
    A.j++;B.j++;A.bp+=x;A.bc+=y;B.bp+=y;B.bc+=x;
    if(x>y){A.g++;A.p+=3;B.d++;ta.classList.add("w")}
    else if(y>x){B.g++;B.p+=3;A.d++;tb.classList.add("w")}
    else{A.n++;B.n++;A.p++;B.p++}
  })});
  document.getElementById("bar").style.width=(n/28*100)+"%";
  document.getElementById("pt").textContent=n+" / 28 matchs joués";
  var L=Object.keys(st).map(function(k){return st[k]});
  L.sort(function(a,b){return b.p-a.p||(b.bp-b.bc)-(a.bp-a.bc)||b.bp-a.bp||a.t.localeCompare(b.t)});
  document.getElementById("tb").innerHTML=L.map(function(e,i){
    var df=e.bp-e.bc;
    return '<tr class="'+(n&&i<3?"r"+(i+1):"")+'"><td class="eq">'+e.t+'</td><td class="p">'+e.p+'</td><td>'+e.j+'</td><td>'+e.g+'</td><td>'+e.n+'</td><td>'+e.d+'</td><td>'+e.bp+'</td><td>'+e.bc+'</td><td>'+(df>0?"+":"")+df+'</td></tr>'
  }).join("")
}
function tab(a){
  document.getElementById("v1").classList.toggle("hide",a!==1);
  document.getElementById("v2").classList.toggle("hide",a!==2);
  document.getElementById("b1").classList.toggle("on",a===1);
  document.getElementById("b2").classList.toggle("on",a===2)
}
document.getElementById("b1").onclick=function(){tab(1)};
document.getElementById("b2").onclick=function(){tab(2)};
document.getElementById("rs").onclick=function(){
  if(!confirm("Effacer tous les scores ?"))return;
  S={};save();
  document.querySelectorAll("input").forEach(function(i){i.value=""});upd()
};
upd();
</script>
</body>
</html>
